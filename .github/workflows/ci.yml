name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PolicyFlow.sln

      - name: Build
        run: dotnet build PolicyFlow.sln --no-restore -c Release

      - name: Test
        run: dotnet test PolicyFlow.sln --no-build -c Release --verbosity normal
