# Run the whole app (web + SQL Server) with:  docker compose up --build
# Then open http://localhost:8080
#
# The password below is for local demo use only. Change it for anything else.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PolicyFlow_Dev#2026"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=PolicyFlowDb;User Id=sa;Password=PolicyFlow_Dev#2026;TrustServerCertificate=True"
      Database__MigrateAndSeedOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  sqldata:
